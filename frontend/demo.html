<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14394e">
  <title>端股｜競賽示範</title>
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="stylesheet" href="/styles.css?v=20261125d">
</head>
<body class="demo-page">
  <main class="demo-shell">
    <header class="demo-header">
      <div><p>端股 ／ 競賽示範</p><h1>多投入一筆，風險會變多少？</h1></div>
      <a class="secondary-button" href="/">返回端股</a>
    </header>
    <p class="demo-notice" id="demoNotice">使用虛構持股與固定示範價格。筆記只保留在此示範頁，重新整理會清除。</p>
    <section class="demo-panel" aria-labelledby="demoHoldingsTitle">
      <div class="demo-section-top">
        <div><h2 id="demoHoldingsTitle">投資總覽</h2><p>切換市場後，摘要與持倉會一同更新。</p></div>
        <label class="demo-market-picker">市場<select id="demoMarket"><option value="tw">台灣</option><option value="us">美國</option></select></label>
      </div>
      <div class="demo-metrics" id="demoMetrics"></div>
      <div class="demo-holdings" id="demoHoldings"></div>
    </section>
    <section class="demo-panel" id="demoScenario" aria-labelledby="demoScenarioTitle" hidden>
      <div class="demo-section-top"><div><h2 id="demoScenarioTitle">持倉試算</h2><p id="demoScenarioIntro"></p></div></div>
      <div class="demo-form">
        <label>加碼預算（原幣）<input id="demoBudget" type="number" min="0" max="1000000" step="0.01"></label>
        <label>假設買入價／股<input id="demoBuy" type="number" min="0.01" max="100000" step="0.01"></label>
      </div>
      <div id="demoComparison" class="scenario-comparison"></div>
      <p id="demoSaveStatus" role="status"></p>
    </section>
    <section class="demo-panel" id="demoJournal" aria-labelledby="demoJournalTitle" hidden>
      <h2 id="demoJournalTitle">示範日誌</h2><div id="demoJournalEntries"></div>
    </section>
    <details class="demo-panel" id="demoStress">
      <summary><strong>進一步體驗整組持倉壓力測試</strong></summary>
      <div class="risk-parameters" data-stress-parameters>
        <label>市場與幣別<select data-stress-scope></select></label>
        <label>全組價格變動（%）<input type="number" min="-100" max="100" step="0.1" value="-10" data-stress-shock></label>
        <div class="risk-presets"><button type="button" class="secondary-button" data-stress-preset="-5">回落 5%</button><button type="button" class="secondary-button" data-stress-preset="-20">回落 20%</button><button type="button" class="secondary-button" data-stress-clear>清除個股設定</button></div>
      </div>
      <p class="risk-status" data-stress-status role="status"></p><div class="risk-metrics" data-stress-metrics></div>
      <div class="risk-table-wrap"><table><caption class="sr-only">模擬持倉個別影響</caption><thead><tr><th scope="col">持股</th><th scope="col">參考市值</th><th scope="col">個股漲跌（%）</th><th scope="col">情境市值</th><th scope="col">影響金額</th></tr></thead><tbody data-stress-rows></tbody></table></div>
      <button type="button" class="secondary-button" data-stress-save disabled>存入示範日誌</button>
    </details>
  </main>
  <script type="module" src="/demo.js?v=20261125d"></script>
</body>
</html>
